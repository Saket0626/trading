  <head>
    <meta charset="UTF-8" />

    <meta name="google-site-verification" content="fHPKRz3yj_ckwgyIAYuwMTZt7IUVdlDqbCINQma-xDE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- STEP 1: META TAGS -->
    <title>Chartwise | Learn Trading From Zero to Quant</title>
    <meta name="description" content="Chartwise is the most structured trading education platform online. Learn day trading, stocks, forex, crypto, and quant strategies. Free, honest, risk-focused." />
    <link rel="canonical" href="https://www.chartwise.info/" />

    <!-- STEP 2: OPEN GRAPH (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Chartwise | Learn Trading From Zero to Quant" />
    <meta property="og:description" content="Chartwise is the most structured trading education platform online. Learn day trading, stocks, forex, crypto, and quant strategies. Free, honest, risk-focused." />
    <meta property="og:image" content="https://www.chartwise.info/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.chartwise.info/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chartwise" />

    <!-- STEP 2: TWITTER CARDS -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chartwise | Learn Trading From Zero to Quant" />
    <meta name="twitter:description" content="Chartwise is the most structured trading education platform online. Learn day trading, stocks, forex, crypto, and quant strategies. Free, honest, risk-focused." />
    <meta name="twitter:image" content="https://www.chartwise.info/og-image.png" />
    <meta name="twitter:image:alt" content="Chartwise - Learn Trading From Zero to Quant" />

    <!-- STEP 3: STRUCTURED DATA (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Chartwise",
      "url": "https://www.chartwise.info/",
      "description": "Learn trading from zero to quant. Structured curriculum, interactive lessons, trading tools, and risk-focused education.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.chartwise.info/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Chartwise",
      "url": "https://www.chartwise.info/",
      "sameAs": []
    }
    </script>

    <!-- STEP 10: FAVICONS (vite.svg is fallback; add favicon.ico, favicon-32x32.png, favicon-16x16.png, apple-touch-icon.png to public/) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

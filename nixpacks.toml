# Railway / Nixpacks config for Vite React static site
# Ensures correct build and start commands

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

# Explicitly bind to 0.0.0.0 so Railway's proxy can reach the app
# PORT is set by Railway; fallback to 3000 for local
[start]
cmd = "node server.js"
